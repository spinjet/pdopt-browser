<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Study model benchmark</title>
  </head>
  <body>
    <h1>Study model benchmark</h1>
    <script type="module">
      import BenchmarkWorker from "../src/study-benchmark.worker?worker";
      let worker;
      window.runStudyBenchmark = (runtime, stopAfter) =>
        new Promise((resolve, reject) => {
          worker = new BenchmarkWorker();
          let lastFrame = performance.now(),
            maxFrameGapMs = 0,
            frames = 0,
            frame;
          function tick(now) {
            maxFrameGapMs = Math.max(maxFrameGapMs, now - lastFrame);
            lastFrame = now;
            frames++;
            frame = requestAnimationFrame(tick);
          }
          frame = requestAnimationFrame(tick);
          const timeout = setTimeout(() => {
            finish();
            reject(new Error("The study benchmark exceeded 120 seconds."));
          }, 120000);
          function finish() {
            clearTimeout(timeout);
            cancelAnimationFrame(frame);
            worker.terminate();
          }
          worker.onerror = (event) => {
            finish();
            reject(new Error(event.message));
          };
          worker.onmessage = ({ data }) => {
            if (data.error) {
              finish();
              reject(new Error(data.error));
              return;
            }
            if (stopAfter && data.fitStarted === stopAfter) {
              setTimeout(() => {
                const start = performance.now();
                finish();
                resolve({
                  cancelled: true,
                  terminateMs: performance.now() - start,
                });
              }, 0);
            }
            if (data.report && !stopAfter) {
              finish();
              resolve({ runtime, ...data, maxFrameGapMs, frames });
            } else if (data.report && stopAfter) {
              finish();
              reject(new Error("Benchmark never started " + stopAfter + "."));
            }
          };
          worker.postMessage({ runtime, stopAfter });
        });
    </script>
  </body>
</html>
